<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración Hidroponía</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #9ca3af; }
        input { 
            width: 100%; padding: 8px; border-radius: 6px; 
            border: 1px solid #374151; background: #1f2937; color: white; 
        }
        .btn-save {
            background: #22c55e; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%;
        }
        .btn-save:hover { background: #16a34a; }
        
        /* Estilo para el mensaje de error */
        .alert-error {
            background-color: #7f1d1d;
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #b91c1c;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="dashboard" style="max-width: 600px;">
        <header class="dashboard__header">
            <h1>Configuración</h1>
            <a href="/" style="color: #60a5fa;">&larr; Volver al Dashboard</a>
        </header>
        
        {% if error_msg %}
        <div class="alert-error">
            ⚠️ {{ error_msg }}
        </div>
        {% endif %}

        <div class="card">
            <form action="/config" method="POST" id="formConfig" onsubmit="return validarFormulario()">
                
                <h2 style="border-bottom: 1px solid #374151; padding-bottom: 10px;">Umbrales de Alerta</h2>
                
                <div class="form-group">
                    <label>Temperatura Mínima (°C) - Alerta Frío - (Led Rojo)</label>
                    <input type="number" step="0.1" name="temp_min" id="temp_min" value="{{ TEMP_MIN }}" required>
                </div>

                <div class="form-group">
                    <label>Temperatura Máxima (°C) - Alerta Calor - (Led Rojo)</label>
                    <input type="number" step="0.1" name="temp_max" id="temp_max" value="{{ TEMP_MAX }}" required>
                </div>

                <div class="form-group">
                    <label>TDS Alerta (ppm) - Led Rojo - (Led Verde)</label>
                    <input type="number" step="1" name="tds_alert" id="tds_alert" value="{{ TDS_ALERT }}" required>
                </div>

                <h2 style="border-bottom: 1px solid #374151; padding-bottom: 10px; margin-top:20px;">Automatización</h2>

                <div class="form-group">
                    <label>Intervalo de Lectura (segundos)</label>
                    <input type="number" step="0.5" min="0.5" name="reading_time" value="{{ TIEMPO_LECTURA }}">
                </div>

                <div class="form-group">
                    <label>TDS Mínimo (ppm) - Disparar Servo - (Led Verde)</label>
                    <input type="number" step="1" name="tds_min" id="tds_min" value="{{ TDS_MIN }}" required>
                </div>

                <div class="form-group">
                    <label>Tiempo de espera Servo (segundos)</label>
                    <input type="number" step="1" name="servo_cd" value="{{ SERVO_COOLDOWN }}">
                </div>

                <button type="submit" class="btn-save">💾 Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script>
        function validarFormulario() {
            // Obtenemos valores
            const tMin = parseFloat(document.getElementById('temp_min').value);
            const tMax = parseFloat(document.getElementById('temp_max').value);
            const tdsMin = parseInt(document.getElementById('tds_min').value);
            const tdsAlert = parseInt(document.getElementById('tds_alert').value);

            let errores = [];

            // Validar Temperatura
            if (tMin >= tMax) {
                errores.push(`La Temperatura Mínima (${tMin}) debe ser menor que la Máxima (${tMax})`);
            }

            // Validar TDS
            if (tdsMin >= tdsAlert) {
                errores.push(`El TDS Mínimo (${tdsMin}) debe ser menor que la Alerta/Máximo (${tdsAlert})`);
            }

            // Si hay errores, alertamos y cancelamos el envío
            if (errores.length > 0) {
                alert("⚠️ Error en la configuración:\n\n" + errores.join("\n"));
                return false; // Cancela el submit
            }

            return true; // Permite el submit
        }
    </script>
</body>
</html>
