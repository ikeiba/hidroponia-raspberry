<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Hidroponía</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    <script type="text/javascript">
        google.charts.load('current', {'packages':['gauge']});
        google.charts.setOnLoadCallback(iniciarDashboard);

        var gaugeTemp, gaugeTDS;
        var dataTemp, dataTDS;
        var optionsTemp, optionsTDS;

        function iniciarDashboard() {
            // Inicializamos datos (igual que antes)
            dataTemp = google.visualization.arrayToDataTable([['Label', 'Value'], ['Temp °C', 0]]);
            dataTDS = google.visualization.arrayToDataTable([['Label', 'Value'], ['TDS ppm', 0]]);

            // --- LÓGICA DE COLORES DINÁMICA ---
            
            // 1. TEMPERATURA
            // Blanco: 0 a TEMP_MIN (Implícito)
            // Verde: TEMP_MIN a TEMP_MAX
            // Naranja (Yellow): TEMP_MAX a TEMP_EMERGENCIA
            // Rojo: TEMP_EMERGENCIA a 40 (Final)
            optionsTemp = {
                width: 300, height: 300, 
                min: 0, max: 40,
                greenFrom: {{ CFG_TEMP_MIN }}, greenTo: {{ CFG_TEMP_MAX }}, 
                yellowFrom: {{ CFG_TEMP_MAX }}, yellowTo: {{ CFG_TEMP_EMG }}, 
                redFrom: {{ CFG_TEMP_EMG }}, redTo: 40,
                minorTicks: 5
            };

            // 2. TDS (Nutrientes)
            // Calculamos el umbral naranja (-10% del máximo de alerta)
            // Ejemplo: Si Alerta es 800 -> Naranja empieza en 720.
            var tdsAlert = {{ CFG_TDS_ALERT }};
            var tdsOrangeStart = tdsAlert * 0.9; 

            // Blanco: 0 a TDS_MIN (Implícito)
            // Verde: TDS_MIN a tdsOrangeStart
            // Naranja: tdsOrangeStart a TDS_ALERT
            // Rojo: TDS_ALERT a 1000 (Final)
            optionsTDS = {
                width: 300, height: 300, 
                min: 0, max: 1000, // He subido un poco el max para ver mejor la zona roja
                greenFrom: {{ CFG_TDS_MIN }}, greenTo: tdsOrangeStart, 
                yellowFrom: tdsOrangeStart, yellowTo: tdsAlert, 
                redFrom: tdsAlert, redTo: 1000,
                minorTicks: 5
            };

            gaugeTemp = new google.visualization.Gauge(document.getElementById('gauge_temp'));
            gaugeTDS = new google.visualization.Gauge(document.getElementById('gauge_tds'));

            gaugeTemp.draw(dataTemp, optionsTemp);
            gaugeTDS.draw(dataTDS, optionsTDS);

            actualizarDatos(); 
            setInterval(actualizarDatos, 2000); 
        }

        async function actualizarDatos() {
            try {
                let response = await fetch('/api/estado');
                let data = await response.json();

                // Gauges
                dataTemp.setValue(0, 1, data.temp || 0);
                dataTDS.setValue(0, 1, data.tds || 0);
                let tempFormatted = data.temp ? data.temp.toFixed(2) : "0.00";
                let tdsFormatted = data.tds ? data.tds.toFixed(2) : "0.00";

                // --- Actualizar Gauges ---
                // Google Charts necesita números, no strings, así que usamos parseFloat()
                dataTemp.setValue(0, 1, parseFloat(tempFormatted));
                dataTDS.setValue(0, 1, parseFloat(tdsFormatted));

                gaugeTemp.draw(dataTemp, optionsTemp);
                gaugeTDS.draw(dataTDS, optionsTDS);

                // Texto valores numéricos (Aquí usamos los strings formateados)
                document.getElementById('val-temp').innerText = tempFormatted + " °C";
                document.getElementById('val-tds').innerText = tdsFormatted + " ppm";
                
                // Servo: Contador y Hora
                document.getElementById('val-servo').innerText = data.servo_count || 0;
                document.getElementById('time-servo').innerText = data.ultimo_servo_time || "--:--:--";

                // Estado Bomba y Botón Power
                let badgeBomba = document.getElementById('badge-bomba');
                let btnPower = document.getElementById('btn-power'); // Referencia al botón nuevo

                if (data.bomba_on) {
                    badgeBomba.className = "badge badge--on";
                    badgeBomba.innerText = "Encendida";
                    
                    // Cambiar estilo del botón web
                    btnPower.classList.add('btn-power--on');
                    btnPower.innerText = "⏻ APAGAR SISTEMA";
                } else {
                    badgeBomba.className = "badge badge--off";
                    badgeBomba.innerText = "Apagada";
                    
                    btnPower.classList.remove('btn-power--on');
                    btnPower.innerText = "⏻ ENCENDER SISTEMA";
                }

                // LEDs
                actualizarLed('led-verde', data.led_verde_on, "ON");
                actualizarLed('led-rojo', data.led_rojo_on, "ALERTA");
                // >>> NUEVO: ACTUALIZAR BARRAS DE SISTEMA <<<
                actualizarBarra('bar-cpu', 'txt-cpu', data.cpu_temp, 80); // Max 80ºC
                actualizarBarra('bar-ram', 'txt-ram', data.ram_usage, 100); // Max 100%

            } catch (error) {
                console.error("Error actualizando:", error);
            }
        }

        function actualizarLed(id, on, texto) {
            let el = document.getElementById(id);
            let circulo = el.querySelector('.led-circle');
            let badge = el.querySelector('.badge');
            if (on) {
                circulo.classList.add('led-circle--on');
                circulo.classList.remove('led-circle--off');
                badge.innerText = texto;
                badge.className = (id==='led-rojo') ? "badge badge--alert" : "badge badge--on";
            } else {
                circulo.classList.remove('led-circle--on');
                circulo.classList.add('led-circle--off');
                badge.innerText = "OFF";
                badge.className = "badge badge--off";
            }
        }

        function actualizarBarra(idBarra, idTexto, valor, maximo) {
            let porcentaje = (valor / maximo) * 100;
            if (porcentaje > 100) porcentaje = 100;
            
            let elBarra = document.getElementById(idBarra);
            let elTexto = document.getElementById(idTexto);
            
            // Actualizar ancho
            elBarra.style.width = porcentaje + "%";
            
            // Actualizar Texto
            let unit = (idBarra === 'bar-cpu') ? "°C" : "%";
            elTexto.innerText = valor + unit;

            // Cambiar color según severidad
            // Si pasa del 80% del máximo -> Rojo
            // Si pasa del 60% del máximo -> Amarillo
            if (valor > maximo * 0.8) {
                elBarra.style.backgroundColor = "#ef4444"; // Rojo
            } else if (valor > maximo * 0.6) {
                elBarra.style.backgroundColor = "#eab308"; // Amarillo
            } else {
                elBarra.style.backgroundColor = "#22c55e"; // Verde
            }
        }

        // Función llamada al hacer click en el botón Power
        async function toggleSistema() {
            try {
                await fetch('/action/toggle', { method: 'POST' });
                // Forzamos actualización inmediata para que se note rápido
                setTimeout(actualizarDatos, 100); 
            } catch (e) {
                alert("Error comunicando con servidor");
            }
        }
    </script>
    <style>
        /* Estilos nuevos para el Botón Power */
        .power-container {
            text-align: center; margin: 20px 0;
        }
        .btn-power {
            background-color: #374151; /* Gris oscuro (Apagado) */
            color: #9ca3af;
            border: 2px solid #4b5563;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-power:hover { transform: scale(1.05); }
        
        .btn-power--on {
            background-color: #dc2626; /* Rojo brillante para APAGAR */
            color: white;
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
        
        .btn-nav {
            background-color: #2563eb; color: white; padding: 8px 16px;
            text-decoration: none; border-radius: 6px; font-weight: 600;
        }
        .btn-nav:hover { opacity: 0.9; }

        /* Estilos para las barras de progreso */
        .progress-container {
            background-color: #374151;
            border-radius: 999px;
            height: 12px;
            width: 100%;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #22c55e; /* Verde por defecto */
            width: 0%;
            transition: width 0.5s ease, background-color 0.5s ease;
        }
        .system-metric {
            margin-bottom: 15px;
        }
        .metric-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #d1d5db;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="dashboard__header">
            <h1>Sistema de Hidroponía</h1>
            
            <div class="power-container">
                <button id="btn-power" class="btn-power" onclick="toggleSistema()">
                    ⏻ ENCENDER SISTEMA
                </button>
            </div>

            <div style="margin: 15px 0; display:flex; justify-content:center; gap:10px;">
                <a href="/graficas" class="btn-nav">📈 Gráficas</a>
                <a href="/logs" class="btn-nav" style="background:#0f172a; border: 1px solid #334155;">📟 Logs</a>
                <a href="/config" class="btn-nav" style="background:#4b5563;">⚙️ Config</a>
            </div>
        </header>

        <section class="dashboard__section dashboard__section--gauges">
            <div class="card card--gauge">
                <h2>Temperatura</h2>
                <div id="gauge_temp" class="gauge"></div>
                <p class="card__value" id="val-temp">--</p>
            </div>
            <div class="card card--gauge">
                <h2>TDS (Nutrientes)</h2>
                <div id="gauge_tds" class="gauge"></div>
                <p class="card__value" id="val-tds">--</p>
            </div>
        </section>

        <section class="dashboard__section dashboard__section--status">
            <div class="card">
                <h2>Bomba de agua</h2>
                <span id="badge-bomba" class="badge badge--off">Cargando...</span>
            </div>

            <div class="card">
                <h2>LEDs</h2>
                <div class="led-status">
                    <div class="led-status__item" id="led-verde">
                        <span class="led-circle led-circle--off"></span>
                        <span>Verde (TDS)</span>
                        <span class="badge badge--off">OFF</span>
                    </div>
                    <div class="led-status__item" id="led-rojo">
                        <span class="led-circle led-circle--red led-circle--off"></span>
                        <span>Rojo (Temp)</span>
                        <span class="badge badge--off">OFF</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Servo</h2>
                <p>Activaciones: <strong id="val-servo">0</strong></p>
                <p style="font-size: 0.85rem; color: #9ca3af; margin-top: 5px;">
                    Última vez: <span id="time-servo" style="color: #e5e7eb;">--:--:--</span>
                </p>
            </div>
                        <div class="card">
                <h2>Salud Raspberry Pi</h2>
                
                <div class="system-metric">
                    <div class="metric-label">
                        <span>CPU Temp</span>
                        <strong id="txt-cpu">0°C</strong>
                    </div>
                    <div class="progress-container">
                        <div id="bar-cpu" class="progress-bar"></div>
                    </div>
                </div>

                <div class="system-metric">
                    <div class="metric-label">
                        <span>RAM Uso</span>
                        <strong id="txt-ram">0%</strong>
                    </div>
                    <div class="progress-container">
                        <div id="bar-ram" class="progress-bar"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
