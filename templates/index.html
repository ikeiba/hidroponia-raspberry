<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Hidroponía</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    <script type="text/javascript">
        google.charts.load('current', {'packages':['gauge']});
        google.charts.setOnLoadCallback(iniciarDashboard);

        var gaugeTemp, gaugeTDS;
        var dataTemp, dataTDS;
        var optionsTemp, optionsTDS;

        function iniciarDashboard() {
            // 1. Inicializar objetos de Google Charts UNA VEZ
            dataTemp = google.visualization.arrayToDataTable([['Label', 'Value'], ['Temp °C', 0]]);
            dataTDS = google.visualization.arrayToDataTable([['Label', 'Value'], ['TDS ppm', 0]]);

            optionsTemp = {
                width: 300, height: 300, min: 0, max: 40,
                greenFrom: 10, greenTo: 30, yellowFrom: 30, yellowTo: 35, redFrom: 35, redTo: 40,
                minorTicks: 5
            };
            optionsTDS = {
                width: 300, height: 300, min: 0, max: 800,
                greenFrom: 0, greenTo: 300, yellowFrom: 300, yellowTo: 400, redFrom: 400, redTo: 800,
                minorTicks: 5
            };

            gaugeTemp = new google.visualization.Gauge(document.getElementById('gauge_temp'));
            gaugeTDS = new google.visualization.Gauge(document.getElementById('gauge_tds'));

            gaugeTemp.draw(dataTemp, optionsTemp);
            gaugeTDS.draw(dataTDS, optionsTDS);

            // 2. Iniciar el bucle de actualización (cada 2 segundos)
            actualizarDatos(); // Primera llamada inmediata
            setInterval(actualizarDatos, 2000); 
        }

        async function actualizarDatos() {
            try {
                // Pedimos el JSON al servidor
                let response = await fetch('/api/estado');
                let data = await response.json();

                // --- Actualizar Gauges ---
                // Google Charts necesita setValue(fila, columna, valor)
                dataTemp.setValue(0, 1, data.temp || 0);
                dataTDS.setValue(0, 1, data.tds || 0);
                
                gaugeTemp.draw(dataTemp, optionsTemp);
                gaugeTDS.draw(dataTDS, optionsTDS);

                // --- Actualizar Textos y Badges ---
                
                // Texto valores numéricos
                document.getElementById('val-temp').innerText = (data.temp ? data.temp + " °C" : "--");
                document.getElementById('val-tds').innerText = (data.tds ? data.tds + " ppm" : "--");
                document.getElementById('val-servo').innerText = data.servo_count || 0;

                // Badge Bomba
                let badgeBomba = document.getElementById('badge-bomba');
                if (data.bomba_on) {
                    badgeBomba.className = "badge badge--on";
                    badgeBomba.innerText = "Encendida";
                } else {
                    badgeBomba.className = "badge badge--off";
                    badgeBomba.innerText = "Apagada";
                }

                // LEDs
                actualizarLed('led-verde', data.led_verde_on, "ON");
                actualizarLed('led-rojo', data.led_rojo_on, "ALERTA");

            } catch (error) {
                console.error("Error actualizando datos:", error);
            }
        }

        function actualizarLed(idElemento, estadoOn, textoOn) {
            let container = document.getElementById(idElemento); // el div padre .led-status__item
            let circulo = container.querySelector('.led-circle');
            let badge = container.querySelector('.badge');

            if (estadoOn) {
                circulo.classList.add('led-circle--on');
                circulo.classList.remove('led-circle--off');
                badge.className = (idElemento === 'led-rojo') ? "badge badge--alert" : "badge badge--on";
                badge.innerText = textoOn;
            } else {
                circulo.classList.remove('led-circle--on');
                circulo.classList.add('led-circle--off');
                badge.className = "badge badge--off";
                badge.innerText = "OFF";
            }
        }
    </script>
</head>
<body>
    <div class="dashboard">
        <header class="dashboard__header">
            <h1>Sistema de Hidroponía</h1>
            <div style="margin: 15px 0; display:flex; justify-content:center; gap:10px;">
                <a href="/graficas" class="btn-nav">📈 Ver Gráficas</a>
                <a href="/config" class="btn-nav" style="background:#4b5563;">⚙️ Configuración</a>
            </div>
            <p class="dashboard__subtitle">Monitor en tiempo real (AJAX)</p>
        </header>

        <section class="dashboard__section dashboard__section--gauges">
            <div class="card card--gauge">
                <h2>Temperatura</h2>
                <div id="gauge_temp" class="gauge"></div>
                <p class="card__value" id="val-temp">--</p>
            </div>
            <div class="card card--gauge">
                <h2>TDS (Nutrientes)</h2>
                <div id="gauge_tds" class="gauge"></div>
                <p class="card__value" id="val-tds">--</p>
            </div>
        </section>

        <section class="dashboard__section dashboard__section--status">
            <div class="card">
                <h2>Bomba de agua</h2>
                <span id="badge-bomba" class="badge badge--off">Cargando...</span>
            </div>

            <div class="card">
                <h2>LEDs</h2>
                <div class="led-status">
                    <div class="led-status__item" id="led-verde">
                        <span class="led-circle led-circle--off"></span>
                        <span>Verde</span>
                        <span class="badge badge--off">OFF</span>
                    </div>
                    <div class="led-status__item" id="led-rojo">
                        <span class="led-circle led-circle--red led-circle--off"></span>
                        <span>Rojo</span>
                        <span class="badge badge--off">OFF</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Servo</h2>
                <p>Activaciones: <strong id="val-servo">0</strong></p>
            </div>
        </section>
    </div>
    
    <style>
        .btn-nav {
            background-color: #2563eb; color: white; padding: 8px 16px;
            text-decoration: none; border-radius: 6px; font-weight: 600;
        }
        .btn-nav:hover { opacity: 0.9; }
    </style>
</body>
</html>
