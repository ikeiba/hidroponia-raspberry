<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Hidroponía</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Ajuste para que los gráficos se vean bien centrados */
        .gauge-container {
            position: relative;
            height: 200px;
            width: 300px;
            margin: 0 auto;
        }
        .gauge-value {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #e5e7eb;
        }
        .gauge-label {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="dashboard__header">
            <h1>Sistema de Hidroponía</h1>
            <div style="margin: 15px 0; display:flex; justify-content:center; gap:10px;">
                <a href="/graficas" class="btn-nav">📈 Ver Gráficas</a>
                <a href="/logs" class="btn-nav" style="background:#0f172a; border: 1px solid #334155;">📟 Logs</a>
                <a href="/config" class="btn-nav" style="background:#4b5563;">⚙️ Configuración</a>
            </div>
            <p class="dashboard__subtitle">Monitor en tiempo real</p>
        </header>

        <section class="dashboard__section dashboard__section--gauges">
            <div class="card card--gauge">
                <h2>Temperatura</h2>
                <div class="gauge-container">
                    <canvas id="chart-temp"></canvas>
                    <div class="gauge-value" id="val-temp-num">--</div>
                    <div class="gauge-label">Grados Celsius (°C)</div>
                </div>
            </div>

            <div class="card card--gauge">
                <h2>TDS (Nutrientes)</h2>
                <div class="gauge-container">
                    <canvas id="chart-tds"></canvas>
                    <div class="gauge-value" id="val-tds-num">--</div>
                    <div class="gauge-label">Partes por millón (ppm)</div>
                </div>
            </div>
        </section>

        <section class="dashboard__section dashboard__section--status">
            <div class="card">
                <h2>Bomba de agua</h2>
                <span id="badge-bomba" class="badge badge--off">Cargando...</span>
            </div>

            <div class="card">
                <h2>LEDs</h2>
                <div class="led-status">
                    <div class="led-status__item" id="led-verde">
                        <span class="led-circle led-circle--off"></span>
                        <span>Verde (TDS/Servo)</span>
                        <span class="badge badge--off">OFF</span>
                    </div>
                    <div class="led-status__item" id="led-rojo">
                        <span class="led-circle led-circle--red led-circle--off"></span>
                        <span>Rojo (Temp)</span>
                        <span class="badge badge--off">OFF</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Servo</h2>
                <p>Dosis aplicadas: <strong id="val-servo">0</strong></p>
            </div>
        </section>
    </div>

    <script>
        let chartTemp, chartTds;

        // Configuración común para gauges tipo "media dona"
        const commonOptions = {
            rotation: -90,
            circumference: 180,
            cutout: '80%', // Grosor de la línea
            plugins: { legend: { display: false }, tooltip: { enabled: false } }
        };

        function iniciarDashboard() {
            // --- 1. Inicializar Gráfico Temperatura ---
            const ctxTemp = document.getElementById('chart-temp').getContext('2d');
            chartTemp = new Chart(ctxTemp, {
                type: 'doughnut',
                data: {
                    labels: ['Valor', 'Restante'],
                    datasets: [{
                        data: [0, 40], // 0 de 40 max
                        backgroundColor: ['#3b82f6', '#1f2937'], // Azul y Gris oscuro
                        borderWidth: 0
                    }]
                },
                options: commonOptions
            });

            // --- 2. Inicializar Gráfico TDS ---
            const ctxTds = document.getElementById('chart-tds').getContext('2d');
            chartTds = new Chart(ctxTds, {
                type: 'doughnut',
                data: {
                    labels: ['Valor', 'Restante'],
                    datasets: [{
                        data: [0, 1000], // 0 de 1000 max
                        backgroundColor: ['#10b981', '#1f2937'], // Verde y Gris oscuro
                        borderWidth: 0
                    }]
                },
                options: commonOptions
            });

            // --- 3. Bucle de actualización ---
            actualizarDatos();
            setInterval(actualizarDatos, 2000);
        }

        async function actualizarDatos() {
            try {
                let response = await fetch('/api/estado');
                let data = await response.json();

                // --- Actualizar TEMP ---
                let temp = data.temp || 0;
                let tempColor = '#3b82f6'; // Azul (normal)
                if (temp < 15) tempColor = '#3b82f6'; // Frío
                if (temp > 25) tempColor = '#ef4444'; // Rojo (Calor)
                
                chartTemp.data.datasets[0].data = [temp, 40 - temp]; // Asumiendo max 40
                chartTemp.data.datasets[0].backgroundColor = [tempColor, '#374151'];
                chartTemp.update();
                document.getElementById('val-temp-num').innerText = temp.toFixed(1);

                // --- Actualizar TDS ---
                let tds = data.tds || 0;
                let tdsColor = '#10b981'; // Verde (bien)
                if (tds < 500) tdsColor = '#f59e0b'; // Amarillo/Naranja (Alerta bajo)
                
                // Topamos el gráfico a 1000 para que no se rompa si sube mucho
                let tdsVisual = tds > 1000 ? 1000 : tds; 
                chartTds.data.datasets[0].data = [tdsVisual, 1000 - tdsVisual];
                chartTds.data.datasets[0].backgroundColor = [tdsColor, '#374151'];
                chartTds.update();
                document.getElementById('val-tds-num').innerText = tds;

                // --- Textos y Badges ---
                document.getElementById('val-servo').innerText = data.servo_count || 0;

                // Badge Bomba
                let badgeBomba = document.getElementById('badge-bomba');
                if (data.bomba_on) {
                    badgeBomba.className = "badge badge--on";
                    badgeBomba.innerText = "Encendida";
                } else {
                    badgeBomba.className = "badge badge--off";
                    badgeBomba.innerText = "Apagada";
                }

                // LEDs
                actualizarLed('led-verde', data.led_verde_on, "ON");
                actualizarLed('led-rojo', data.led_rojo_on, "ALERTA");

            } catch (error) {
                console.error("Error:", error);
            }
        }

        function actualizarLed(id, on, text) {
            let el = document.getElementById(id);
            let circle = el.querySelector('.led-circle');
            let badge = el.querySelector('.badge');
            if(on){
                circle.classList.add('led-circle--on');
                circle.classList.remove('led-circle--off');
                badge.className = id === 'led-rojo' ? "badge badge--alert" : "badge badge--on";
                badge.innerText = text;
            } else {
                circle.classList.remove('led-circle--on');
                circle.classList.add('led-circle--off');
                badge.className = "badge badge--off";
                badge.innerText = "OFF";
            }
        }

        // Arrancar
        iniciarDashboard();
    </script>
</body>
</html>
